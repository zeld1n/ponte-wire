spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5433/pontewire_db
    username: admin
    password: password
  application:
    name: pw-gateway
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    admin:
      auto-create: true
  data:
    redis:
      host: localhost
      port: 6379


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
server:
  port: 8080

pontewire:
  hmac:
    secret: ${PONTEWIRE_HMAC_SECRET:local-dev-secret}
  rate-limit:
    requests-per-minute: 10
  routing:
    default-topic: pw.incoming
    routes:
      stripe:  pw.incoming.payments
      shopify: pw.incoming.commerce
      github:  pw.incoming.devops
      gitlab:  pw.incoming.devops